services:
  api:
    build:
      context: ..
      dockerfile: Q2/Dockerfile
    container_name: spam-api-q2
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL: 300
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: spam-redis
    ports:
      - "6379:6379"
